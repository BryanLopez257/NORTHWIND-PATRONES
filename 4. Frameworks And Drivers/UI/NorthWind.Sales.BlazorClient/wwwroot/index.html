<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>NorthWind Sales</title>
    <base href="/" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" />
    <link rel="stylesheet" href="css/app.css" />
    <link href="NorthWind.Sales.BlazorClient.styles.css" rel="stylesheet" />
    <link rel="icon" type="image/png" href="favicon.png" />
</head>

<body>
    <div id="app">
        <svg class="loading-progress">
            <circle r="40%" cx="50%" cy="50%" />
            <circle r="40%" cx="50%" cy="50%" />
        </svg>
        <div class="loading-progress-text">Cargando aplicación NorthWind...</div>
    </div>

    <div id="blazor-error-ui">
        Se produjo un error no controlado.
        <a href="" class="reload">Recargar</a>
        <a class="dismiss">🗙</a>
    </div>
    <script src="_framework/blazor.webassembly.js"></script>
    <script>
        // Bloqueo en tiempo real de números para campos restringidos a letras
        document.addEventListener('keypress', function (e) {
            if (!e.target || !e.key) return;
            if (e.target.hasAttribute('data-letters-only')) {
                // Solo letras (incluyendo tildes/ñ) y espacios - BLOQUEA NÚMEROS
                if (!/^[a-zA-ZáéíóúÁÉÍÓÚñÑüÜ\s]$/.test(e.key)) {
                    e.preventDefault();
                }
            } else if (e.target.hasAttribute('data-alpha-only')) {
                // Solo letras del alfabeto (sin números ni espacios)
                if (!/^[a-zA-Z]$/.test(e.key)) {
                    e.preventDefault();
                }
            }
        }, true);

        document.addEventListener('input', function (e) {
            if (!e.target) return;
            if (e.target.hasAttribute('data-letters-only')) {
                var clean = e.target.value.replace(/[^a-zA-ZáéíóúÁÉÍÓÚñÑüÜ\s]/g, '');
                if (e.target.value !== clean) {
                    e.target.value = clean;
                }
            } else if (e.target.hasAttribute('data-alpha-only')) {
                var clean = e.target.value.replace(/[^a-zA-Z]/g, '');
                if (e.target.value !== clean) {
                    e.target.value = clean;
                }
            }
        }, true);
    </script>
</body>

</html>
